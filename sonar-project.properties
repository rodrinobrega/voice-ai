# SonarQube Cloud / SonarQube Community Edition project configuration.
# CI runs this automatically (see .github/workflows/ci.yml). For a local scan:
#   docker compose --profile sonar up -d sonarqube
#   (wait for http://localhost:9000 to come up, log in admin/admin, generate
#    a local token, export SONAR_TOKEN=<token>)
#   npm run sonar:local
#
# sonar.projectKey / sonar.organization below assume a SonarQube Cloud
# project named "voice-ai" under your organization — update to match what you
# create at https://sonarcloud.io before the CI workflow will authenticate.

sonar.projectKey=voice-ai-transcription-platform
sonar.projectName=Voice AI Audio Transcription Platform
sonar.organization=CHANGE_ME_SONARCLOUD_ORG

# Two-module layout: backend (Node/Lambda) + frontend (Nuxt/Vue).
sonar.sources=backend/src,frontend/pages,frontend/components,frontend/composables,frontend/stores,frontend/middleware,frontend/types
sonar.tests=backend/tests,frontend/composables,frontend/components,frontend/stores,frontend/middleware
sonar.test.inclusions=**/*.test.ts,**/*.cy.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/.nuxt/**,**/coverage/**,**/*.d.ts,**/public/worklets/**

# JS/TS coverage — both workspaces write lcov here (see jest.config.js
# `coverageReporters` in each package).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Quality gate expectations (enforced in SonarQube Cloud project settings,
# not here — documented for reference):
#   - Coverage on new code >= 80%
#   - 0 new bugs / vulnerabilities
#   - Duplicated lines on new code < 3%
#   - Maintainability rating on new code = A
