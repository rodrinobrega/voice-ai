service: voice-ai-backend

frameworkVersion: '3'

useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-iam-roles-per-function
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 29
  logRetentionInDays: ${self:custom.logRetentionInDays.${self:provider.stage}, 14}
  httpApi:
    cors:
      allowedOrigins:
        - ${env:WEB_ORIGIN, 'http://localhost:3000'}
      allowedHeaders:
        - Content-Type
        - Authorization
        - x-webhook-secret
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowCredentials: false
    authorizers:
      cognitoJwtAuthorizer:
        identitySource: $request.header.Authorization
        issuerUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
        audience:
          - !Ref CognitoUserPoolClient
  environment:
    STAGE: ${self:provider.stage}
    DYNAMODB_TABLE: ${self:custom.tableName}
    AUDIO_BUCKET: ${self:custom.audioBucketName}
    TRANSCRIPTS_BUCKET: ${self:custom.transcriptsBucketName}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
    SPEECHMATICS_API_KEY_PARAM: ${self:custom.speechmaticsApiKeyParamName}
    SPEECHMATICS_WEBHOOK_SECRET_PARAM: ${self:custom.speechmaticsWebhookSecretParamName}
    SPEECHMATICS_BASE_URL: ${env:SPEECHMATICS_BASE_URL, 'https://asr.api.speechmatics.com/v2'}
    SPEECHMATICS_MGMT_URL: ${env:SPEECHMATICS_MGMT_URL, 'https://mp.speechmatics.com/v1'}
    SPEECHMATICS_RT_URL: ${env:SPEECHMATICS_RT_URL, 'wss://eu.rt.speechmatics.com/v2'}
  tracing:
    apiGateway: true
    lambda: true

custom:
  tableName: voice-ai-transcriptions-${self:provider.stage}
  audioBucketName: voice-ai-audio-${self:provider.stage}
  transcriptsBucketName: voice-ai-transcripts-${self:provider.stage}
  webBucketName: voice-ai-web-${self:provider.stage}
  # Deterministic ARNs. Built from the bucket *names* rather than !GetAtt so the
  # per-function roles never depend on the bucket resource — AudioBucket has to
  # DependsOn the S3->Lambda permission (for its NotificationConfiguration), and
  # a GetAtt here would close that into a circular dependency.
  audioBucketArn: arn:aws:s3:::${self:custom.audioBucketName}
  transcriptsBucketArn: arn:aws:s3:::${self:custom.transcriptsBucketName}
  speechmaticsApiKeyParamName: /voice-ai/${self:provider.stage}/speechmatics-api-key
  speechmaticsWebhookSecretParamName: /voice-ai/${self:provider.stage}/speechmatics-webhook-secret
  logRetentionInDays:
    prod: 90
    dev: 14
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - '@aws-sdk/*'
    define:
      require.resolve: undefined
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3002
    noPrependStageInUrl: true

package:
  individually: true

functions:
  me:
    handler: src/handlers/me.handler
    description: Returns the caller's verified Cognito claims (wiring smoke test).
    events:
      - httpApi:
          path: /me
          method: get
          authorizer: cognitoJwtAuthorizer

  getUploadUrl:
    handler: src/handlers/getUploadUrl.handler
    description: Creates a transcription record and returns a presigned S3 POST for direct audio upload.
    events:
      - httpApi:
          path: /transcriptions/upload-url
          method: post
          authorizer: cognitoJwtAuthorizer
    iamRoleStatementsName: voice-ai-${self:provider.stage}-getUploadUrl-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource: !GetAtt TranscriptionsTable.Arn
      - Effect: Allow
        Action:
          - s3:PutObject
        Resource: ${self:custom.audioBucketArn}/audio/*

  processUploadedAudio:
    handler: src/handlers/processUploadedAudio.handler
    description: S3 ObjectCreated trigger — submits the uploaded audio as a Speechmatics batch job.
    environment:
      API_BASE_URL: !GetAtt HttpApi.ApiEndpoint
    # The S3 notification is wired in `resources` (AudioBucket.NotificationConfiguration
    # + ProcessUploadedAudioS3Permission) rather than with a `s3:` event here: the
    # framework's `s3` event expects a bucket *name* and creates the bucket itself,
    # which cannot be combined with a fully specified AWS::S3::Bucket resource.
    iamRoleStatementsName: voice-ai-${self:provider.stage}-processUploadedAudio-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - s3:GetObject
        Resource: ${self:custom.audioBucketArn}/audio/*
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource:
          - !GetAtt TranscriptionsTable.Arn
          - !Sub '${TranscriptionsTable.Arn}/index/GSI1'
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.speechmaticsApiKeyParamName}'
          - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.speechmaticsWebhookSecretParamName}'

  speechmaticsWebhook:
    handler: src/handlers/speechmaticsWebhook.handler
    description: Speechmatics job-completion callback (shared-secret auth, no Cognito).
    events:
      - httpApi:
          path: /transcriptions/webhook
          method: post
    iamRoleStatementsName: voice-ai-${self:provider.stage}-speechmaticsWebhook-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.speechmaticsApiKeyParamName}'
          - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.speechmaticsWebhookSecretParamName}'
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource:
          - !GetAtt TranscriptionsTable.Arn
          - !Sub '${TranscriptionsTable.Arn}/index/GSI1'
      - Effect: Allow
        Action:
          - s3:PutObject
        Resource: ${self:custom.transcriptsBucketArn}/*

  checkStuckTranscriptions:
    handler: src/handlers/checkStuckTranscriptions.handler
    description: Scheduled fallback — reconciles PROCESSING items stuck past the timeout in case a webhook was missed.
    events:
      - schedule: rate(5 minutes)
    iamRoleStatementsName: voice-ai-${self:provider.stage}-checkStuck-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Scan
          - dynamodb:UpdateItem
        Resource: !GetAtt TranscriptionsTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource: !Sub '${TranscriptionsTable.Arn}/index/GSI1'
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.speechmaticsApiKeyParamName}'
      - Effect: Allow
        Action:
          - s3:PutObject
        Resource: ${self:custom.transcriptsBucketArn}/*

  getRealtimeToken:
    handler: src/handlers/getRealtimeToken.handler
    description: Mints a short-lived Speechmatics real-time API key for the browser.
    events:
      - httpApi:
          path: /transcriptions/realtime-token
          method: post
          authorizer: cognitoJwtAuthorizer
    iamRoleStatementsName: voice-ai-${self:provider.stage}-getRealtimeToken-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.speechmaticsApiKeyParamName}'

  saveRealtimeTranscript:
    handler: src/handlers/saveRealtimeTranscript.handler
    description: Persists a finished real-time transcript and creates its history record.
    events:
      - httpApi:
          path: /transcriptions/realtime
          method: post
          authorizer: cognitoJwtAuthorizer
    iamRoleStatementsName: voice-ai-${self:provider.stage}-saveRealtime-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - s3:PutObject
        Resource: ${self:custom.transcriptsBucketArn}/*
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource: !GetAtt TranscriptionsTable.Arn

  listTranscriptions:
    handler: src/handlers/listTranscriptions.handler
    description: Lists the caller's transcription history, paginated 10 per page.
    events:
      - httpApi:
          path: /transcriptions
          method: get
          authorizer: cognitoJwtAuthorizer
    iamRoleStatementsName: voice-ai-${self:provider.stage}-listTranscriptions-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource: !GetAtt TranscriptionsTable.Arn

  getDownloadUrl:
    handler: src/handlers/getDownloadUrl.handler
    description: Returns a presigned download URL for a completed transcript, after an ownership check.
    events:
      - httpApi:
          path: /transcriptions/{id}/download
          method: get
          authorizer: cognitoJwtAuthorizer
    iamRoleStatementsName: voice-ai-${self:provider.stage}-getDownloadUrl-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - !GetAtt TranscriptionsTable.Arn
          - !Sub '${TranscriptionsTable.Arn}/index/GSI1'
      - Effect: Allow
        Action:
          - s3:GetObject
        Resource: ${self:custom.transcriptsBucketArn}/*

  getTranscription:
    handler: src/handlers/getTranscription.handler
    description: Fetches a single transcription (for status polling), after an ownership check.
    events:
      - httpApi:
          path: /transcriptions/{id}
          method: get
          authorizer: cognitoJwtAuthorizer
    iamRoleStatementsName: voice-ai-${self:provider.stage}-getTranscription-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - !GetAtt TranscriptionsTable.Arn
          - !Sub '${TranscriptionsTable.Arn}/index/GSI1'

resources:
  Resources:
    # ---------------------------------------------------------------------
    # Cognito
    # ---------------------------------------------------------------------
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: voice-ai-users-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        Schema:
          - Name: email
            Required: true
            Mutable: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: voice-ai-web-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        PreventUserExistenceErrors: ENABLED

    # ---------------------------------------------------------------------
    # DynamoDB — single table, on-demand, PITR on, GSI1 for id-only lookups
    # ---------------------------------------------------------------------
    TranscriptionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        # No SSESpecification: DynamoDB always encrypts at rest with an AWS-owned
        # key at no cost. `SSEEnabled: true` would instead select the AWS-managed
        # KMS key (aws/dynamodb) — billable, and needs KMS rights the deploy user
        # deliberately does not have. Same encryption guarantee either way.

    # ---------------------------------------------------------------------
    # S3 — audio (short-lived), transcripts (long-lived), web (static site)
    # ---------------------------------------------------------------------
    ProcessUploadedAudioS3Permission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt ProcessUploadedAudioLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: s3.amazonaws.com
        SourceAccount: !Ref AWS::AccountId
        # Literal ARN, not !GetAtt AudioBucket.Arn — the bucket depends on this
        # permission, so referencing it here would be circular.
        SourceArn: ${self:custom.audioBucketArn}

    AudioBucket:
      Type: AWS::S3::Bucket
      DependsOn: ProcessUploadedAudioS3Permission
      Properties:
        BucketName: ${self:custom.audioBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, POST]
              AllowedOrigins:
                - ${env:WEB_ORIGIN, 'http://localhost:3000'}
              AllowedHeaders: ['*']
              MaxAge: 3000
        LifecycleConfiguration:
          Rules:
            - Id: ExpireAudioAfter30Days
              Status: Enabled
              ExpirationInDays: 30
        NotificationConfiguration:
          LambdaConfigurations:
            - Event: 's3:ObjectCreated:*'
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: audio/
              Function: !GetAtt ProcessUploadedAudioLambdaFunction.Arn

    AudioBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref AudioBucket
        PolicyDocument:
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - !GetAtt AudioBucket.Arn
                - !Sub '${AudioBucket.Arn}/*'
              Condition:
                Bool:
                  'aws:SecureTransport': 'false'

    TranscriptsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.transcriptsBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET]
              AllowedOrigins:
                - ${env:WEB_ORIGIN, 'http://localhost:3000'}
              AllowedHeaders: ['*']
              MaxAge: 3000

    TranscriptsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref TranscriptsBucket
        PolicyDocument:
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - !GetAtt TranscriptsBucket.Arn
                - !Sub '${TranscriptsBucket.Arn}/*'
              Condition:
                Bool:
                  'aws:SecureTransport': 'false'

    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.webBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    # ---------------------------------------------------------------------
    # CloudFront — serves the static SPA out of the private WebBucket.
    # The bucket stays fully private; CloudFront reads it through an Origin
    # Access Control (OAC, the successor to OAI) and is the only principal
    # the bucket policy trusts.
    # ---------------------------------------------------------------------
    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: voice-ai-web-${self:provider.stage}
          Description: OAC for the Voice AI web bucket (${self:provider.stage})
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: Voice AI SPA (${self:provider.stage})
          DefaultRootObject: index.html
          HttpVersion: http2and3
          IPV6Enabled: true
          # PriceClass_100 = NA + EU edge locations only; cheapest tier that
          # still covers the users this stage is for.
          PriceClass: PriceClass_100
          Origins:
            - Id: WebBucketOrigin
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              # Required even with OAC: an empty OAI string tells CloudFront
              # this is an S3 (not custom) origin.
              S3OriginConfig:
                OriginAccessIdentity: ''
          DefaultCacheBehavior:
            TargetOriginId: WebBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed policies: CachingOptimized + SecurityHeadersPolicy
            # (HSTS, X-Content-Type-Options, Referrer-Policy, frame-deny).
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          # SPA routing: client-side routes have no S3 object behind them, and
          # a private bucket answers unknown keys with 403 rather than 404.
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 10
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 10
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: 's3:GetObject'
              Resource: !Sub '${WebBucket.Arn}/*'
              Condition:
                StringEquals:
                  'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - !GetAtt WebBucket.Arn
                - !Sub '${WebBucket.Arn}/*'
              Condition:
                Bool:
                  'aws:SecureTransport': 'false'

  Outputs:
    # NB: no HttpApiUrl output here — the framework already emits one for the
    # httpApi event, and a same-named block gets deep-merged into it, producing
    # a Value with both Fn::Join and Fn::GetAtt keys (invalid: must be a String).
    CognitoUserPoolId:
      Description: Cognito User Pool id (frontend NUXT_PUBLIC_COGNITO_USER_POOL_ID).
      Value: !Ref CognitoUserPool
    CognitoUserPoolClientId:
      Description: Cognito App Client id (frontend NUXT_PUBLIC_COGNITO_CLIENT_ID).
      Value: !Ref CognitoUserPoolClient
    AudioBucketName:
      Value: !Ref AudioBucket
    TranscriptsBucketName:
      Value: !Ref TranscriptsBucket
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionId:
      Description: CloudFront distribution id (for cache invalidation on deploy).
      Value: !Ref WebDistribution
    WebUrl:
      Description: Public URL of the deployed SPA — also the value WEB_ORIGIN must hold for CORS.
      Value: !Sub 'https://${WebDistribution.DomainName}'
